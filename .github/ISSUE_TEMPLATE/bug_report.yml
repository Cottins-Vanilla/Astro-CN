name: 问题反馈
description: 报告可复现的程序问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿填写 API 密钥、令牌或私人笔记。截图请使用演示数据。
  - type: input
    id: version
    attributes:
      label: 应用版本与 Windows 版本
      placeholder: Astro CN 0.2.0 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始描述可以重复执行的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 演示截图或补充信息
